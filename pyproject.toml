[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frida-down"
version = "0.1.1"
description = "A lightweight Frida binaries downloader"
readme = "README.md"
requires-python = ">=3.8"
license = "AGPL-3.0-only"
authors = [
    {name = "its-me-abi", email = "keralaboypypi@keralaboy.anonaddy.com"}
]
keywords = ["frida", "downloader", "binaries", "android", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
]

dependencies = [
    "certifi==2026.5.20",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "cryptography==48.0.0",
    "idna==3.17",
    "pycparser==3.0",
    "PyGithub==2.9.1",
    "PyJWT==2.13.0",
    "PyNaCl==1.6.2",
    "requests==2.34.2",
    "typing_extensions==4.15.0",
    "urllib3==2.7.0",
]

[project.urls]
Homepage = "https://github.com/its-me-abi/frida_down"
Repository = "https://github.com/its-me-abi/frida_down.git"
"Bug Tracker" = "https://github.com/its-me-abi/frida_down/issues"
Documentation = "https://github.com/its-me-abi/frida_down#readme"

[project.scripts]
frida-down = "frida_down.cli:main"

[tool.setuptools]
packages = ["frida_down"]

[tool.setuptools.package-data]
frida_down = ["frida_data/*"]
